# merino-light -- the status bar of the Neovim merino colorscheme with mini.statusline's
# powerline wedges. Colors are mini.base16's statusline groups (see
# nvim/colors/merino.lua), so the two bars match.

# Mode segment like MiniStatuslineMode*, size segment like MiniStatuslineDevinfo.
[mode]
normal_main = { fg = "#ffffff", bg = "#1f2328", bold = true } # Normal: base00 on base05
normal_alt  = { fg = "#696d71", bg = "#dcdee2" }              # base04 on base02
select_main = { fg = "#ffffff", bg = "#116329", bold = true } # Visual: base00 on base0B
select_alt  = { fg = "#696d71", bg = "#dcdee2" }
unset_main  = { fg = "#ffffff", bg = "#cf222e", bold = true } # Command: base00 on base08
unset_alt   = { fg = "#696d71", bg = "#dcdee2" }

# The bar's middle is MiniStatuslineFilename. Flat outer edges, solid inner wedges.
[status]
overall   = { fg = "#878a8e", bg = "#eceef2" } # base03 on base01
sep_left  = { open = "", close = "\ue0b0" }
sep_right = { open = "\ue0b2", close = "" }
