# Prompt configuration — https://starship.rs/config/
#
# A single line, git status on the right:
#
#   left     cgreen@Mac ~/.config
#   right     main !1
#
# The directory sits in a rounded pill, and git sits in a fill of its own —
# rounded on the left, running flat to the terminal edge on the right.
#
#
# MECHANICS
#
# Rounded ends are the powerline half-circle glyphs U+E0B6/U+E0B4, drawn as
# *foreground* in the fill's background color so they cap it. Along with
# U+E0A0, the git branch glyph, they are Private Use Area codepoints and show
# as boxes in an editor, but Ghostty draws them itself — no patched font
# required. (Editors without those glyphs may also *strip* them on save,
# which silently flattens the pills — the example above keeps them so that
# loss is visible.)
#
#
# COLORS
#
# ghostty/config sets `theme = dark:atomic, light:atomic_light`, and that pair
# is not a light/dark mirror of each other in the usual way:
#
#   palette 0  (black)         bg_border — a background tone in both themes
#   palette 7  (white)         the foreground in both themes
#   palette 8  (bright-black)  fg_dim — a *foreground* tone, light in atomic
#   palette 15 (bright-white)  the foreground again
#
# So 0/7 is the only true background/foreground pair — 9.66:1 in atomic and
# 9.57:1 in atomic_light, in either direction. Palette 7 is exactly base05
# (the atomic foreground), so the path pill fills with it and reads as an
# inverted block, while the git pill keeps the black fill; both track the
# active theme because the pair is named in ANSI, not hex. The
# [palettes.atomic] table binds the pair to `fill`/`on_fill`. Everything
# outside the fills rides the terminal's default foreground.
#
# There is no [character] module: the prompt simply ends and the cursor sits
# in the space after it. Nothing in the prompt reflects the last command's
# exit status as a result.

"$schema" = 'https://starship.rs/config-schema.json'

# The default, stated for the record: a blank line before each prompt.
add_newline = true

format = '$username$hostname$directory'

right_format = '($git_branch$git_commit$git_status[](fg:fill))'

palette = 'atomic'

[palettes.atomic]
fill = 'black'
on_fill = 'white'


#
# LEFT PROMPT
#

[username]
# starship hides username and hostname unless you are root or over SSH; these
# two keys are what keep both on screen locally.
show_always = true
# Empty on purpose — only root gets color.
style_user = ''
style_root = 'fg:bright-red'
format = '[$user]($style)'

[hostname]
ssh_only = false
format = '@$hostname '

[directory]
# base05 fill with base00 text. base00 is only reachable as the terminal's
# *default background* — no ANSI slot carries it — so instead of naming it,
# set the foreground to on_fill, leave the background at the default, and let
# `inverted` swap them: the fill becomes base05 and the text base00, in both
# themes.
style = 'fg:on_fill inverted'
format = '[](fg:on_fill)[$path]($style)[](fg:on_fill) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false


#
# RIGHT PROMPT
#
# One pill, rounded at both ends. The closing cap lives in right_format's
# outer (...) group, so it renders after whichever git module comes last —
# and not at all outside a repo, where the group is empty and vanishes.
# Branch and commit are made mutually exclusive: `only_attached`
# keeps git_branch from printing a literal "HEAD" on a detached HEAD, and
# git_commit only renders there — so each carries its own cap. All modules
# pad themselves on the right so a clean repo still ends in background rather
# than in text.
#

[git_branch]
only_attached = true
style = 'fg:on_fill bg:fill'
format = '[](fg:fill)[ $branch ]($style)'

[git_commit]
style = 'fg:on_fill bg:fill'
format = '[](fg:fill)[$hash$tag ]($style)'

[git_status]
style = 'fg:on_fill bg:fill'
format = '([$all_status$ahead_behind ]($style))'
