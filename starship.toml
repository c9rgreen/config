# Prompt configuration — https://starship.rs/config/
#
# A single-line two-tone bar on the left, git status on the right:
#
#   left     cgreen  Mac  ~/.config
#   right     main !1
#
# where user@host carries an inverted fill and everything else the normal one.
#
#
# MECHANICS
#
# A fill is a background in a module's own style, never in the format string
# around it: wrapping `$directory` in a styled bracket would style the bracket
# rather than the module, leaving a gap in the bar.
#
# Segments abut directly, with no separator glyphs between them — adjacent
# fills meet edge to edge. The one Private Use Area codepoint left is U+E0A0,
# the git branch glyph, which shows as a box in an editor without a powerline
# font. Ghostty draws it itself, no patched font required.
#
#
# COLORS
#
# ghostty/config sets `theme = dark:atomic, light:atomic_light`, and that pair is
# not a light/dark mirror of each other in the usual way:
#
#   palette 0  (black)         bg_border — a background tone in both themes
#   palette 7  (white)         the foreground in both themes
#   palette 8  (bright-black)  fg_dim — a *foreground* tone, light in atomic
#   palette 15 (bright-white)  the foreground again
#
# So bright-black is not dark and bright-white is not light; both are text
# colors. Pairing them, as an ordinary powerline config does, puts foreground on
# foreground — 1.34:1 in atomic, 1.53:1 in atomic_light, i.e. unreadable. Hues
# are no better as fills, because the palette holds each hue at roughly one
# lightness across both themes: white-on-blue is 3.67:1 in atomic but 2.54:1 in
# atomic_light, white-on-purple 4.01:1 / 2.28:1.
#
# That leaves 0/7 as the only true background/foreground pair, so the whole bar
# is built from it — in both directions, for 9.66:1 dark / 9.57:1 light either
# way:
#
#   white on black   directory, git
#   black on white   username, hostname
#
# user@host is therefore set apart by inverting the pair rather than by a hue. It
# reads as a light block in atomic and a dark one in atomic_light — inverted
# against the rest of the bar in both.
#
# There is no [character] module: the bar simply ends and the cursor sits in
# the space after it. Nothing in the prompt reflects the last command's exit
# status as a result.

"$schema" = 'https://starship.rs/config-schema.json'

format = '$username$hostname$directory '

right_format = '$git_branch$git_status'


#
# LEFT PROMPT
#

[username]
# starship hides username and hostname unless you are root or over SSH; these
# two keys are what keep both on screen locally.
show_always = true
style_user = 'fg:black bg:white'
# 3.15:1 dark / 2.77:1 light — under AA for body text, but this is a short bold
# label that only shows as root, where standing out matters more. (It was 3.07:1
# / 3.45:1 back when this segment took the normal fill; bright-red is a
# mid-lightness hue, so the inverted fill costs a little in atomic_light.)
style_root = 'fg:bright-red bold bg:white'
format = '[ $user ]($style)'

[hostname]
ssh_only = false
style = 'fg:black bg:white'
format = '[ $hostname ]($style)'

[directory]
style = 'fg:white bg:black'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false


#
# RIGHT PROMPT
#
# One segment running to the terminal edge. Both modules pad themselves on the
# right; that way a clean repo still ends in background rather than in text.
#

[git_branch]
symbol = ''
style = 'fg:white bg:black'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'fg:white bg:black'
format = '([$all_status$ahead_behind ]($style))'
