# Prompt configuration — https://starship.rs/config/
#
# A single-line powerline bar on the left, git status on the right:
#
#   left     cgreen  Mac  ~/.config 
#   right      main !1
#
# where user@host sits on a green fill, git on a magenta one, and the path
# on a full inverted fill, so the path is the segment that stands out.
#
#
# MECHANICS
#
# A fill is a background in a module's own style, never in the format string
# around it: wrapping `$directory` in a styled bracket would style the
# bracket rather than the module, leaving a gap in the bar.
#
# The separators between segments are literal text, styled inline:
#
#   U+E0B0  ends a segment against whatever follows — the next fill, or the
#           terminal background at the end of the bar. Its foreground is the
#           *outgoing* fill, its background the incoming one.
#   U+E0B1  the thin variant, for dividing two segments that share one fill,
#           where U+E0B0 would be drawing that fill onto itself, invisibly.
#   U+E0B2  opens a segment from the left. Only the right prompt needs one.
#   U+E0A0  the git branch glyph.
#
# All four are Private Use Area codepoints, so they show as boxes in an
# editor without a powerline font — the numbers are spelled out here to keep
# them identifiable. Terminals that draw box/powerline glyphs themselves
# (Ghostty among them) need no patched font. (Editors without those glyphs
# may also *strip* them on save, which silently breaks the bar — the example
# above keeps them so that loss is visible.)
#
#
# COLORS
#
# The bar names two palette hues — green on the left, magenta on the
# right — and otherwise leans on what ANSI itself promises. It uses
# three fills:
#
#   the full fill   `inverted` alone — reverse video — swaps the terminal's
#                   default foreground and background. That pair is, by
#                   definition, the theme's own text-on-background contrast.
#                   The path rides it.
#
#   the green fill  `fg:green inverted` — a green fill with the text
#                   knocked out in the default background color. user@host
#                   rides it.
#
#   the magenta fill  `fg:purple inverted` (starship names ANSI magenta
#                     `purple`) — the same knockout, background-colored
#                     text on magenta. The git segments ride it.
#
# Neither end of the reverse-video trick is reachable directly: no `bg:`
# value names the default foreground, and no `fg:` names the default
# background. Both separators inside the bar therefore state themselves
# backwards and let the terminal swap them: the thin divider is
# `fg:green inverted` — a background-colored line on the green fill — and
# the transition from the green fill into the full one is
# `bg:green inverted`, a green arrow on a foreground-colored ground. The
# separators at the bar's outer edges are simply *unstyled*: default
# foreground on default background is already the closing shape.
#
# Bright-red is reserved for root — an alert distinct from both fills.
#
# There is no [character] module: the bar ends at its closing separator and
# the cursor sits in the space after it. Nothing in the prompt reflects the
# last command's exit status as a result.

"$schema" = 'https://starship.rs/config-schema.json'

# The default, stated for the record: a blank line before each prompt.
add_newline = true

format = '$username[](fg:green inverted)$hostname[](bg:green inverted)$directory '

right_format = '$git_branch$git_commit$git_status'


#
# LEFT PROMPT
#

[username]
# starship hides username and hostname unless you are root or over SSH; these
# two keys are what keep both on screen locally.
show_always = true
style_user = 'fg:green inverted'
# fg:bright-red inverted = a bright-red fill with background-colored text: a
# red block in the bar. The thin divider after it stays on the green fill, so
# the block simply abuts it — acceptable for a root-only edge case.
style_root = 'fg:bright-red bold inverted'
format = '[ $user ]($style)'

[hostname]
ssh_only = false
style = 'fg:green inverted'
format = '[ $hostname ]($style)'

[directory]
style = 'inverted'
format = '[ $path ]($style)'
truncation_symbol = '…/'
truncate_to_repo = false


#
# RIGHT PROMPT
#
# One segment on the magenta fill, running to the terminal edge, so it needs no
# closing separator. Branch and commit are made mutually exclusive:
# `only_attached` keeps git_branch from printing a literal "HEAD" on a
# detached HEAD, and git_commit only renders there — so each carries its
# own U+E0B2 opener, drawn in the fill color on the terminal background.
# Outside a repo every module renders empty, so the side vanishes on its
# own. All modules pad themselves on the right so a clean repo still ends
# in background rather than in text.
#

[git_branch]
only_attached = true
style = 'fg:purple inverted'
format = '[](fg:purple)[ $symbol$branch ]($style)'

[git_commit]
style = 'fg:purple inverted'
format = '[](fg:purple)[$hash ]($style)'

[git_status]
style = 'fg:purple inverted'
format = '([$all_status$ahead_behind ]($style))'
