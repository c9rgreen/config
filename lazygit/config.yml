# Theme for the atomic.nvim Ghostty pair (dark:atomic, light:atomic_light).
#
# Unlike broot, lazygit can't switch skins on the terminal's luma, so hex
# values from either variant become unreadable in the other (the dark
# variant's cream fg is 1.02:1 on atomic_light's background). ANSI names
# track whichever theme is active instead.
#
# The slots both variants agree on (see ghostty/themes/atomic*):
#   0 tracks the background side (bg_border), 7/15 the foreground, and
#   default-fg-on-0 holds ~9.6:1 in both — so selections get a 0 background
#   and text keeps the terminal default. No chromatic slot reaches 4.5:1 in
#   both variants, so colors mark accents (borders, bold), not body text,
#   and the commit-row states use reverse video: terminal-bg text on the
#   accent, which keeps the accent-vs-background ratio (3.9:1 or better)
#   rather than compounding two weak colors.
#
# Doc at https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
gui:
  theme:
    activeBorderColor:
      - cyan # the theme's teal accent (6.2:1 dark, 3.9:1 light)
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - yellow # 9.1:1 dark, 4.0:1 light
      - bold
    optionsTextColor:
      - default
    selectedLineBgColor:
      - black # bg_border in both variants; default fg on it is ~9.6:1
    inactiveViewSelectedLineBgColor:
      - bold # lazygit's default: marks the line without a background
    cherryPickedCommitFgColor:
      - cyan
    cherryPickedCommitBgColor:
      - reverse # terminal-bg text on teal
    markedBaseCommitFgColor:
      - yellow
    markedBaseCommitBgColor:
      - reverse # terminal-bg text on yellow
    unstagedChangesColor:
      - red # semantic; atomic's red is its weakest slot in the dark
      - bold # variant (3.0:1), so bold carries it there (5.0:1 in light)
    defaultFgColor:
      - default
